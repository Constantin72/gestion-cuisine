[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-cuisine"
version = "2.0.0"
description = "Gestion locale des stocks d'une cuisine associative"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Stock Cuisine"}]
dependencies = []

[project.scripts]
stock-cuisine = "stock_cuisine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_cuisine = ["py.typed"]
